name: Supabase Backup

on:
  schedule:
    # Ejecutar todos los domingos a las 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
    # Permitir ejecución manual desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run pg_dump backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Missing SUPABASE_DB_URL GitHub Actions secret. Store the full session-pooler URI from Supabase Connect settings."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != postgres://* && "$SUPABASE_DB_URL" != postgresql://* ]]; then
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URI."
            exit 1
          fi
          mkdir -p backups
          DATE=$(date +'%Y%m%d_%H%M%S')
          pg_dump --no-password --dbname="$SUPABASE_DB_URL" -F p -b -v -f backups/cubitat-backup-$DATE.sql

      - name: Compress backup file
        run: |
          cd backups
          zip -r backup.zip *.sql
          rm *.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup
          path: backups/backup.zip
          retention-days: 90
