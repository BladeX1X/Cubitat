name: Supabase Backup

on:
  schedule:
    # Ejecutar todos los domingos a las 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
    # Permitir ejecución manual desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run pg_dump backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Missing SUPABASE_DB_URL GitHub Actions secret. Store the full session-pooler URI from Supabase Connect settings."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != postgres://* && "$SUPABASE_DB_URL" != postgresql://* ]]; then
            echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URI."
            exit 1
          fi
          mkdir -p backups
          DATE=$(date +'%Y%m%d_%H%M%S')
          docker run --rm \
            --env SUPABASE_DB_URL \
            --env BACKUP_FILE="cubitat-backup-$DATE.sql" \
            --volume "$GITHUB_WORKSPACE/backups:/backups" \
            postgres:17-alpine \
            sh -c 'pg_dump --no-password --dbname="$SUPABASE_DB_URL" -F p -b -v -f "/backups/$BACKUP_FILE"'

      - name: Compress backup file
        run: |
          cd backups
          zip -r backup.zip *.sql
          rm *.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-database-backup
          path: backups/backup.zip
          retention-days: 90
