name: Supabase Production Schema Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cubitat-production-schema-snapshot
  cancel-in-progress: false

jobs:
  schema-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout release SQL sources as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/phase34-production-20261115
          path: release-source

      - name: Verify production target and capture schema-only snapshot
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$SUPABASE_DB_URL" || "$SUPABASE_DB_URL" != *tohjzoncoosvjbjcakdl* ]]; then
            echo "SUPABASE_DB_URL is absent or does not identify Cubitat production."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/cubitat-production-schema"
          cat > "$RUNNER_TEMP/cubitat-production-schema/property-contact-data-shape.sql" <<'SQL'
          SELECT
            count(*) AS property_rows,
            count(*) FILTER (WHERE contact_info IS NULL) AS contact_json_null,
            count(*) FILTER (WHERE contact_info = '{}'::jsonb) AS contact_json_empty_object,
            count(*) FILTER (WHERE contact_info IS NOT NULL AND jsonb_typeof(contact_info) <> 'object') AS contact_json_non_object,
            count(*) FILTER (WHERE jsonb_typeof(contact_info) = 'object' AND contact_info <> '{}'::jsonb) AS contact_json_nonempty_object,
            count(*) FILTER (WHERE jsonb_typeof(contact_info) = 'object' AND (contact_info - ARRAY['name','phone','email']::text[]) <> '{}'::jsonb) AS contact_object_with_unmapped_keys,
            count(*) FILTER (WHERE contact_info ? 'name' AND jsonb_typeof(contact_info->'name') NOT IN ('string','null')) AS contact_name_non_string,
            count(*) FILTER (WHERE contact_info ? 'phone' AND jsonb_typeof(contact_info->'phone') NOT IN ('string','null')) AS contact_phone_non_string,
            count(*) FILTER (WHERE contact_info ? 'email' AND jsonb_typeof(contact_info->'email') NOT IN ('string','null')) AS contact_email_non_string,
            count(*) FILTER (WHERE octet_length(btrim(contact_info->>'name')) > 480) AS contact_name_over_limit,
            count(*) FILTER (WHERE octet_length(btrim(contact_info->>'phone')) > 64) AS contact_phone_over_limit,
            count(*) FILTER (WHERE octet_length(btrim(contact_info->>'email')) > 1020) AS contact_email_over_limit
          FROM public.properties;
          SQL
          docker run --rm \
            --env SUPABASE_DB_URL \
            --volume "$RUNNER_TEMP/cubitat-production-schema:/snapshot" \
            postgres:17-alpine \
            sh -ceu '
              pg_dump --no-password --schema-only --dbname="$SUPABASE_DB_URL" \
                --file=/snapshot/schema.sql
              psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
                -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" \
                > /snapshot/remote-migration-versions.txt
              psql "$SUPABASE_DB_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 \
                -f /snapshot/property-contact-data-shape.sql \
                > /snapshot/property-contact-data-shape.txt
            '
          cp release-source/web/supabase/migrations/*.sql \
            "$RUNNER_TEMP/cubitat-production-schema/"
          (
            cd "$RUNNER_TEMP/cubitat-production-schema"
            sha256sum schema.sql remote-migration-versions.txt property-contact-data-shape.sql property-contact-data-shape.txt
            printf 'schema.sql bytes: '
            wc -c < schema.sql
          )

      - name: Upload temporary schema snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cubitat-production-schema-${{ github.run_id }}
          path: ${{ runner.temp }}/cubitat-production-schema/
          retention-days: 1
