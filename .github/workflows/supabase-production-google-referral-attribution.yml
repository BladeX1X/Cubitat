name: Apply Google referral attribution migration to production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY GOOGLE REFERRAL ATTRIBUTION WITHOUT BACKUP to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cubitat-production-database-migrations
  cancel-in-progress: false

jobs:
  apply-reviewed-migration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Confirm user request without backup
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != 'APPLY GOOGLE REFERRAL ATTRIBUTION WITHOUT BACKUP' ]]; then
            echo 'Confirmation phrase mismatch; production was not changed.'
            exit 1
          fi

      - name: Stage canonical recorded migrations and pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cubitat-google-referral-production"
          mkdir -p "$root/supabase/migrations" "$root/supabase/templates"
          cp web/supabase/config.toml "$root/supabase/config.toml"
          cp web/supabase/templates/confirmation.html \
            web/supabase/templates/recovery.html \
            web/supabase/templates/password_changed_notification.html \
            "$root/supabase/templates/"
          candidate='20261125110000_oauth_agent_signup_attribution.sql'
          actual_hash=$(sha256sum "web/supabase/migrations/$candidate" | cut -d' ' -f1)
          [[ "$actual_hash" == '681ad7b83ff53b8e5c4e1e82fa0d371dd745b7cac29dec60d5498be53e107f37' ]] || {
            echo 'Candidate migration differs from the reviewed source; stopping.'; exit 1;
          }
          cp "web/supabase/migrations/$candidate" "$root/supabase/migrations/"
          echo "MIGRATION_WORKDIR=$root" >> "$GITHUB_ENV"
          echo 'Pinned candidate migration checksum confirmed.'

      - name: Verify target, exact ledger, and schema preconditions
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          candidate='20261125110000'
          if [[ -z "$SUPABASE_DB_URL" || "$SUPABASE_DB_URL" != *'postgres.tohjzoncoosvjbjcakdl'* ]]; then
            echo 'Database URL does not identify the intended Cubitat production project.'
            exit 1
          fi
          remote_versions=$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -c 'select version from supabase_migrations.schema_migrations order by version')
          if grep -Fxq "$candidate" <<<"$remote_versions"; then
            echo 'Candidate migration is already registered; stopping for reconciliation.'
            exit 1
          fi
          for required in 20261103170000 20261125100000; do
            if ! grep -Fxq "$required" <<<"$remote_versions"; then
              echo 'A required production referral migration is absent; stopping before schema changes.'
              exit 1
            fi
          done
          shopt -s nullglob
          while IFS= read -r version; do
            [[ -z "$version" ]] && continue
            if [[ ! "$version" =~ ^[0-9]{14}$ ]]; then
              echo 'Production ledger contains a non-canonical version; stopping.'
              exit 1
            fi
            matches=(web/supabase/migrations/"${version}"_*.sql)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo 'A recorded production migration has no unique canonical source; stopping.'
              exit 1
            fi
            cp "${matches[0]}" "$MIGRATION_WORKDIR/supabase/migrations/"
          done <<<"$remote_versions"
          local_versions=$(find "$MIGRATION_WORKDIR/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' | sort -u)
          pending=$(comm -23 <(printf '%s\n' "$local_versions") <(printf '%s\n' "$remote_versions" | sort -u))
          [[ "$pending" == "$candidate" ]] || { echo 'Pending migrations are not exactly the reviewed OAuth referral candidate; stopping.'; exit 1; }
          schema_state=$(psql "$SUPABASE_DB_URL" -X -qAt -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            (to_regclass('public.profiles') IS NOT NULL)::text,
            (to_regclass('public.agent_signup_attributions') IS NOT NULL)::text,
            (to_regclass('public.agent_referral_links') IS NOT NULL)::text,
            (to_regprocedure('public.get_own_agent_acquisition_metrics()') IS NOT NULL)::text,
            (to_regprocedure('public.attribute_own_oauth_agent_signup(text)') IS NULL)::text,
            (SELECT relrowsecurity FROM pg_class WHERE oid='public.agent_signup_attributions'::regclass)::text,
            (NOT has_table_privilege('anon','public.agent_signup_attributions','SELECT'))::text,
            (NOT has_table_privilege('authenticated','public.agent_signup_attributions','SELECT'))::text;
          SQL
          )
          [[ "$schema_state" == 'true|true|true|true|true|true|true|true' ]] || {
            echo 'Production schema is not in the reviewed pre-migration state; stopping.'; exit 1;
          }
          echo 'Production target, ledger, and schema preconditions verified.'

      - name: Dry-run exactly the reviewed migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          set +e
          output=$(supabase db push --workdir "$MIGRATION_WORKDIR" --db-url "$SUPABASE_DB_URL" --dry-run --include-all --yes 2>&1)
          status=$?
          set -e
          safe=$(printf '%s\n' "$output" | sed -E 's#(postgres(ql)?://[^:/@[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g')
          printf '%s\n' "$safe"
          [[ "$status" -eq 0 ]] || { echo 'Dry-run failed; production was not changed.'; exit "$status"; }
          versions=$(grep -Eo '202[0-9]{11}' <<<"$output" | sort -u || true)
          [[ "$versions" == '20261125110000' ]] || { echo 'Dry-run did not select exactly the reviewed migration.'; exit 1; }

      - name: Apply the reviewed migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          supabase db push --workdir "$MIGRATION_WORKDIR" --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Verify migration history, function security, and grants
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            function_oid oid := to_regprocedure('public.attribute_own_oauth_agent_signup(text)');
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='20261125110000')
              OR function_oid IS NULL
              OR (SELECT NOT prosecdef OR proconfig IS DISTINCT FROM ARRAY['search_path=pg_catalog'] FROM pg_proc WHERE oid=function_oid)
              OR NOT has_function_privilege('authenticated',function_oid,'EXECUTE')
              OR has_function_privilege('anon',function_oid,'EXECUTE')
              OR has_function_privilege('service_role',function_oid,'EXECUTE')
              OR has_table_privilege('authenticated','public.agent_signup_attributions','SELECT')
              OR has_table_privilege('anon','public.agent_signup_attributions','SELECT') THEN
              RAISE EXCEPTION 'oauth_agent_signup_attribution_postcheck_failed';
            END IF;
          END;
          $$;
          SELECT 'Cubitat production Google referral attribution migration verified';
          SQL
