name: Apply publication coordinates migration to production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY PUBLICATION COORDINATES TO PRODUCTION WITHOUT BACKUP to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cubitat-production-database-migrations
  cancel-in-progress: false

jobs:
  apply-reviewed-coordinate-migration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Confirm the explicit no-backup request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != 'APPLY PUBLICATION COORDINATES TO PRODUCTION WITHOUT BACKUP' ]]; then
            echo 'Confirmation phrase mismatch; production was not changed.'
            exit 1
          fi
          echo 'Explicit production migration request without backup confirmed.'

      - name: Stage the pinned candidate migration
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cubitat-publication-coordinates-production"
          mkdir -p "$root/supabase/migrations" "$root/supabase/templates"
          cp web/supabase/config.toml "$root/supabase/config.toml"
          cp web/supabase/templates/confirmation.html \
            web/supabase/templates/recovery.html \
            web/supabase/templates/password_changed_notification.html \
            "$root/supabase/templates/"
          candidate='20261128120000_material_municipality_coordinates_contract.sql'
          actual_hash=$(sha256sum "web/supabase/migrations/$candidate" | cut -d' ' -f1)
          [[ "$actual_hash" == 'b8aa8b266b9524c2fac2a52c29f656b0f74a81a5c2e132ea7e5bc5a855179747' ]] || {
            echo 'Candidate migration differs from the reviewed source; stopping.'; exit 1;
          }
          cp "web/supabase/migrations/$candidate" "$root/supabase/migrations/"
          echo "MIGRATION_WORKDIR=$root" >> "$GITHUB_ENV"
          echo "COORDINATE_MIGRATION=$candidate" >> "$GITHUB_ENV"
          echo 'Pinned migration checksum confirmed.'

      - name: Verify target, full ledger reconciliation, and schema preconditions
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          candidate='20261128120000'
          if [[ -z "$SUPABASE_DB_URL" || "$SUPABASE_DB_URL" != *'postgres.tohjzoncoosvjbjcakdl'* ]]; then
            echo 'Database URL does not identify the intended Cubitat production project.'
            exit 1
          fi
          remote_versions=$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -c 'select version from supabase_migrations.schema_migrations order by version')
          if grep -Fxq "$candidate" <<<"$remote_versions"; then
            echo 'Candidate migration is already registered; stopping for reconciliation.'
            exit 1
          fi
          [[ "$(wc -l <<<"$remote_versions" | tr -d ' ')" == '174' ]] || {
            echo 'Production migration ledger count changed; reconcile before applying.'; exit 1;
          }
          [[ "$(tail -n 1 <<<"$remote_versions")" == '20261126120000' ]] || {
            echo 'Production migration head changed; reconcile before applying.'; exit 1;
          }
          shopt -s nullglob
          while IFS= read -r version; do
            [[ -z "$version" ]] && continue
            if [[ ! "$version" =~ ^[0-9]{14}$ ]]; then
              echo 'Production ledger contains a non-canonical version; stopping.'
              exit 1
            fi
            matches=(web/supabase/migrations/"${version}"_*.sql)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "Recorded production version has no unique canonical source: $version"
              exit 1
            fi
            cp "${matches[0]}" "$MIGRATION_WORKDIR/supabase/migrations/"
          done <<<"$remote_versions"
          local_versions=$(find "$MIGRATION_WORKDIR/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' | sort -u)
          pending=$(comm -23 <(printf '%s\n' "$local_versions") <(printf '%s\n' "$remote_versions" | sort -u))
          [[ "$pending" == "$candidate" ]] || { echo 'Pending migrations are not exactly the reviewed candidate; stopping.'; exit 1; }
          schema_state=$(psql "$SUPABASE_DB_URL" -X -qAt -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            (to_regclass('public.material_listings') IS NOT NULL)::text,
            (to_regclass('public.material_private_coordinates') IS NOT NULL)::text,
            (to_regprocedure('public.normalize_property_coordinates_json(jsonb)') IS NOT NULL)::text,
            (to_regprocedure('public.approximate_marketplace_coordinates(jsonb)') IS NOT NULL)::text,
            (SELECT count(*) = 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='material_listings' AND column_name='municipality')::text,
            (to_regprocedure('public.get_my_material_listings()') IS NOT NULL)::text,
            (to_regprocedure('public.update_material_listing(uuid,text,text,text,numeric,text,text,text,text,text,text[],jsonb)') IS NOT NULL)::text,
            (to_regprocedure('public.update_material_listing(uuid,text,text,text,numeric,text,text,text,text,text,text,text[],jsonb)') IS NULL)::text,
            (SELECT count(*) = 1 FROM pg_trigger WHERE tgname='protect_material_coordinates' AND NOT tgisinternal)::text;
          SQL
          )
          [[ "$schema_state" == 'true|true|true|true|true|true|true|true|true' ]] || {
            echo 'Production schema is not in the reviewed pre-migration state; stopping.'; exit 1;
          }
          echo 'Production target, migration sources, ledger, and schema preconditions verified.'

      - name: Dry-run exactly the reviewed municipality migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          set +e
          output=$(supabase db push --workdir "$MIGRATION_WORKDIR" --db-url "$SUPABASE_DB_URL" --dry-run --include-all --yes 2>&1)
          status=$?
          set -e
          safe=$(printf '%s\n' "$output" | sed -E 's#(postgres(ql)?://[^:/@[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g')
          printf '%s\n' "$safe"
          [[ "$status" -eq 0 ]] || { echo 'Dry-run failed; production was not changed.'; exit "$status"; }
          versions=$(grep -Eo '202[0-9]{11}' <<<"$output" | sort -u || true)
          [[ "$versions" == '20261128120000' ]] || { echo 'Dry-run did not select exactly the reviewed migration.'; exit 1; }

      - name: Apply the reviewed municipality migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          supabase db push --workdir "$MIGRATION_WORKDIR" --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Verify production migration, RPC security, and grants
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            owner_read oid := to_regprocedure('public.get_my_material_listings()');
            owner_update oid := to_regprocedure('public.update_material_listing(uuid,text,text,text,numeric,text,text,text,text,text,text,text[],jsonb)');
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='20261128120000')
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='material_listings' AND column_name='municipality')
              OR NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid='public.material_listings'::regclass AND conname='material_listings_municipality_length_check')
              OR NOT EXISTS (SELECT 1 FROM pg_index WHERE indexrelid='public.material_listings_public_municipality_idx'::regclass AND indisvalid)
              OR owner_read IS NULL OR owner_update IS NULL
              OR to_regprocedure('public.update_material_listing(uuid,text,text,text,numeric,text,text,text,text,text,text[],jsonb)') IS NOT NULL THEN
              RAISE EXCEPTION 'material_municipality_schema_incomplete';
            END IF;
            IF (SELECT NOT prosecdef OR proconfig IS DISTINCT FROM ARRAY['search_path=pg_catalog'] FROM pg_proc WHERE oid=owner_read)
              OR (SELECT NOT prosecdef OR proconfig IS DISTINCT FROM ARRAY['search_path=pg_catalog'] FROM pg_proc WHERE oid=owner_update)
              OR position('listing.owner_id = (SELECT auth.uid())' IN (SELECT prosrc FROM pg_proc WHERE oid=owner_read)) = 0
              OR position('listing.owner_id = (SELECT auth.uid())' IN (SELECT prosrc FROM pg_proc WHERE oid=owner_update)) = 0
              OR has_function_privilege('anon',owner_read,'EXECUTE')
              OR has_function_privilege('anon',owner_update,'EXECUTE')
              OR has_function_privilege('authenticated',owner_read,'EXECUTE') IS NOT TRUE
              OR has_function_privilege('authenticated',owner_update,'EXECUTE') IS NOT TRUE
              OR has_column_privilege('anon','public.material_listings','municipality','SELECT') IS NOT TRUE
              OR has_column_privilege('authenticated','public.material_listings','municipality','SELECT') IS NOT TRUE
              OR has_column_privilege('authenticated','public.material_listings','municipality','INSERT') IS NOT TRUE THEN
              RAISE EXCEPTION 'material_municipality_security_or_grants_invalid';
            END IF;
          END;
          $$;
          SELECT 'Cubitat production material municipality migration verified';
          SQL
