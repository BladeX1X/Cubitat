name: Apply publication coordinates migration to production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY PUBLICATION COORDINATES TO PRODUCTION to confirm
        required: true
        type: string
      backup_run_id:
        description: Successful production backup workflow run ID from the last 24 hours
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cubitat-production-database-migrations
  cancel-in-progress: false

jobs:
  apply-reviewed-coordinate-migration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the canonical historical source for the recorded production migration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ba3359065b838dbf4c155b78a6174f80058c5a2f
          path: migration-history-source

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Confirm explicit request and recent recoverable backup
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != 'APPLY PUBLICATION COORDINATES TO PRODUCTION' ]]; then
            echo 'Confirmation phrase mismatch; production was not changed.'
            exit 1
          fi
          if [[ ! "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'Backup run ID must contain digits only.'
            exit 1
          fi
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID")
          conclusion=$(jq -r '.conclusion' <<<"$run_json")
          created=$(jq -r '.created_at' <<<"$run_json")
          workflow=$(jq -r '.name' <<<"$run_json")
          if [[ "$conclusion" != success || "$workflow" != 'Supabase Backup' ]]; then
            echo 'The selected run is not a successful Supabase production backup.'
            exit 1
          fi
          age_seconds=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          if (( age_seconds < 0 || age_seconds > 86400 )); then
            echo 'The verified backup must be less than 24 hours old.'
            exit 1
          fi
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "supabase-database-backup" and .expired == false) | .id' | head -n 1)
          if [[ -z "$artifact" ]]; then
            echo 'The selected backup artifact is missing or expired.'
            exit 1
          fi
          echo 'Recent successful production backup artifact confirmed.'

      - name: Stage canonical recorded migrations and the pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cubitat-publication-coordinates-production"
          mkdir -p "$root/supabase/migrations" "$root/supabase/templates"
          cp web/supabase/config.toml "$root/supabase/config.toml"
          cp web/supabase/templates/confirmation.html \
            web/supabase/templates/recovery.html \
            web/supabase/templates/password_changed_notification.html \
            "$root/supabase/templates/"
          candidate='20261124100000_marketplace_publication_coordinates.sql'
          actual_hash=$(sha256sum "web/supabase/migrations/$candidate" | cut -d' ' -f1)
          [[ "$actual_hash" == 'fe2f6ad0c67b5dd71a0ee14ca50020b6223cda63d61293dc990a5858281f7bf2' ]] || {
            echo 'Candidate migration differs from the reviewed source; stopping.'; exit 1;
          }
          cp "web/supabase/migrations/$candidate" "$root/supabase/migrations/"
          echo "MIGRATION_WORKDIR=$root" >> "$GITHUB_ENV"
          echo "COORDINATE_MIGRATION=$candidate" >> "$GITHUB_ENV"
          echo 'Pinned migration checksum confirmed.'

      - name: Verify production target, exact ledger, and safe pre-migration state
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$SUPABASE_DB_URL" || "$SUPABASE_DB_URL" != *'postgres.tohjzoncoosvjbjcakdl'* ]]; then
            echo 'Database URL does not identify the intended Cubitat production project.'
            exit 1
          fi
          remote_versions=$(psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -c 'select version from supabase_migrations.schema_migrations order by version')
          if grep -Fxq '20261124100000' <<<"$remote_versions"; then
            echo 'Candidate migration is already registered; stopping for reconciliation.'
            exit 1
          fi
          shopt -s nullglob
          while IFS= read -r version; do
            [[ -z "$version" ]] && continue
            if [[ ! "$version" =~ ^[0-9]{14}$ ]]; then
              echo 'Production ledger contains a non-canonical version; stopping.'
              exit 1
            fi
            matches=(web/supabase/migrations/"${version}"_*.sql)
            if [[ ${#matches[@]} -ne 1 ]]; then
              case "$version" in
                20261120203809)
                  historical=(migration-history-source/web/supabase/migrations/20261120203809_material_listing_municipality.sql)
                  if [[ ${#historical[@]} -ne 1 || ! -f "${historical[0]}" ]]; then
                    echo 'The pinned canonical source for recorded migration 20261120203809 is missing.'
                    exit 1
                  fi
                  historical_hash=$(sha256sum "${historical[0]}" | cut -d' ' -f1)
                  [[ "$historical_hash" == 'e7e8d7946189e840e75acaea7eb93bae69771a6d018f601a7c4b06967811f7cc' ]] || {
                    echo 'The pinned canonical source for migration 20261120203809 changed; stopping.'; exit 1;
                  }
                  cp "${historical[0]}" "$MIGRATION_WORKDIR/supabase/migrations/"
                  ;;
                *)
                  echo "Recorded production version has no unique canonical source: $version"
                  exit 1
                  ;;
              esac
            else
              cp "${matches[0]}" "$MIGRATION_WORKDIR/supabase/migrations/"
            fi
          done <<<"$remote_versions"
          local_versions=$(find "$MIGRATION_WORKDIR/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' | sort -u)
          pending=$(comm -23 <(printf '%s\n' "$local_versions") <(printf '%s\n' "$remote_versions" | sort -u))
          [[ "$pending" == '20261124100000' ]] || { echo 'Pending migrations are not exactly the reviewed coordinate candidate.'; exit 1; }
          schema_state=$(psql "$SUPABASE_DB_URL" -X -qAt -F '|' -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            (to_regclass('public.home_service_providers') IS NOT NULL)::text,
            (to_regclass('public.material_listings') IS NOT NULL)::text,
            (to_regprocedure('public.normalize_property_coordinates_json(jsonb)') IS NOT NULL)::text,
            (to_regclass('public.home_service_private_coordinates') IS NULL)::text,
            (to_regclass('public.material_private_coordinates') IS NULL)::text,
            (NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='home_service_providers' AND column_name='coordinates'))::text,
            (NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='material_listings' AND column_name='coordinates'))::text,
            (NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname IN ('protect_home_service_coordinates','protect_material_coordinates') AND NOT tgisinternal))::text;
          SQL
          )
          [[ "$schema_state" == 'true|true|true|true|true|true|true|true' ]] || {
            echo 'Production schema is not in the reviewed pre-migration state; stopping.'; exit 1;
          }
          echo 'Production target, ledger, and schema preconditions verified.'

      - name: Dry-run exactly the reviewed coordinate migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          set +e
          output=$(supabase db push --workdir "$MIGRATION_WORKDIR" --db-url "$SUPABASE_DB_URL" --dry-run --include-all --yes 2>&1)
          status=$?
          set -e
          safe=$(printf '%s\n' "$output" | sed -E 's#(postgres(ql)?://[^:/@[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g')
          printf '%s\n' "$safe"
          [[ "$status" -eq 0 ]] || { echo 'Dry-run failed; production was not changed.'; exit "$status"; }
          versions=$(grep -Eo '202[0-9]{11}' <<<"$output" | sort -u || true)
          [[ "$versions" == '20261124100000' ]] || { echo 'Dry-run did not select exactly the reviewed migration.'; exit 1; }

      - name: Apply the reviewed coordinate migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          supabase db push --workdir "$MIGRATION_WORKDIR" --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Verify production migration history, RLS, grants, RPCs, and triggers
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          psql "$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='20261124100000')
              OR to_regclass('public.home_service_private_coordinates') IS NULL
              OR to_regclass('public.material_private_coordinates') IS NULL
              OR to_regprocedure('public.approximate_marketplace_coordinates(jsonb)') IS NULL
              OR to_regprocedure('public.protect_marketplace_coordinates()') IS NULL
              OR to_regprocedure('public.get_my_home_service_providers()') IS NULL
              OR to_regprocedure('public.get_my_material_listings()') IS NULL THEN
              RAISE EXCEPTION 'publication_coordinates_schema_incomplete';
            END IF;
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.home_service_private_coordinates'::regclass)
              OR NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.material_private_coordinates'::regclass)
              OR has_table_privilege('anon','public.home_service_private_coordinates','SELECT')
              OR has_table_privilege('anon','public.material_private_coordinates','SELECT')
              OR NOT has_table_privilege('authenticated','public.home_service_private_coordinates','SELECT')
              OR NOT has_table_privilege('authenticated','public.material_private_coordinates','SELECT')
              OR has_column_privilege('anon','public.home_service_providers','coordinates','SELECT') IS NOT TRUE
              OR has_column_privilege('anon','public.material_listings','coordinates','SELECT') IS NOT TRUE THEN
              RAISE EXCEPTION 'publication_coordinates_privileges_invalid';
            END IF;
            IF (SELECT count(*) FROM pg_trigger WHERE tgname IN ('protect_home_service_coordinates','protect_material_coordinates') AND NOT tgisinternal) <> 2
              OR (SELECT count(*) FROM pg_policies WHERE schemaname='public' AND policyname IN ('home_service_private_coordinates_owner_read','material_private_coordinates_owner_read')) <> 2 THEN
              RAISE EXCEPTION 'publication_coordinates_triggers_or_policies_incomplete';
            END IF;
          END;
          $$;
          SELECT 'Cubitat production publication coordinates migration verified';
          SQL
