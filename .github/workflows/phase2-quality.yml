name: Cubitat quality gates

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
  pull_request:
  workflow_dispatch:
  # Re-run the existing audit and quality gates even when no code changes land.
  schedule:
    - cron: '17 19 * * 1'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: |
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          node scripts/audit-withdrawn-advisories.mjs

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Production build and isolation checks
        env:
          SITEMAP_MODE: static
        run: npm run build

      - name: Phase 2 DEV build and checks
        env:
          SITEMAP_MODE: static
        run: npm run build:phase2-dev

      - name: Property documents production profile and isolation checks
        env:
          SITEMAP_MODE: static
          VITE_SUPABASE_URL: https://tohjzoncoosvjbjcakdl.supabase.co
          VITE_SUPABASE_ANON_KEY: phase2-ci-placeholder-not-a-credential
        run: npm run build:phase2-documents

      - name: Full Phase 2 production profile and isolation checks
        env:
          SITEMAP_MODE: static
          VITE_SUPABASE_URL: https://tohjzoncoosvjbjcakdl.supabase.co
          VITE_SUPABASE_ANON_KEY: phase2-ci-placeholder-not-a-credential
        run: npm run build:phase2-production:ci

      - name: Full Phase 3 production profile and isolation checks
        env:
          SITEMAP_MODE: static
          VITE_SUPABASE_URL: https://tohjzoncoosvjbjcakdl.supabase.co
          VITE_SUPABASE_ANON_KEY: phase3-ci-placeholder-not-a-credential
        run: npm run build:phase3-production:ci

      - name: Full Phase 4 production profile and isolation checks
        env:
          SITEMAP_MODE: static
          VITE_SUPABASE_URL: https://tohjzoncoosvjbjcakdl.supabase.co
          VITE_SUPABASE_ANON_KEY: phase4-ci-placeholder-not-a-credential
        run: npm run build:phase4-production:ci

  database-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.108.0

      - name: Start isolated Supabase and run database security suite
        run: |
          set -euo pipefail
          supabase start -x studio,edge-runtime,logflare,vector
          supabase db reset --local --no-seed --yes
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/marketplace_publication_coordinates_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/temporary_admin_mfa_override.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/agent_application_intake_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/agent_application_review_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/agent_application_email_outbox_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/agent_application_province_capacity_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/agent_application_evidence_retention_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/agent_signup_referral_attribution_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/agent_acquisition_metrics_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/billing_plan_catalog_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/phase4_production_contracts_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/material_photo_owner_storage_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/public_property_select_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/public_property_contact_privileges_local.sql
          docker exec -i supabase_db_web psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/phase4_marketplace_rollout_local.sql
