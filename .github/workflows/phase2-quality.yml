name: Cubitat quality gates

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Production build and isolation checks
        env:
          SITEMAP_MODE: static
        run: npm run build

      - name: Phase 2 DEV build and checks
        env:
          SITEMAP_MODE: static
        run: npm run build:phase2-dev

      - name: Property documents production profile and isolation checks
        env:
          SITEMAP_MODE: static
          VITE_SUPABASE_URL: https://tohjzoncoosvjbjcakdl.supabase.co
          VITE_SUPABASE_ANON_KEY: phase2-ci-placeholder-not-a-credential
        run: npm run build:phase2-documents
