name: Apply production pHash coverage migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  apply-phash-coverage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.108.0

      - name: Confirm target and exact pending migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Missing SUPABASE_DB_URL GitHub Actions secret."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != *"postgres.tohjzoncoosvjbjcakdl"* ]]; then
            echo "::error::SUPABASE_DB_URL does not identify the Cubitat production project."
            exit 1
          fi
          plan="$(supabase db push --db-url "$SUPABASE_DB_URL" --dry-run 2>&1)"
          printf '%s\n' "$plan"
          migrations=()
          while IFS= read -r line; do
            if [[ "$line" == *".sql" ]]; then
              migrations+=("${line##* }")
            fi
          done <<< "$plan"
          printf 'Pending migration files: %s\n' "${migrations[*]:-none}"
          if (( ${#migrations[@]} != 1 )) || [[ "${migrations[0]:-}" != "20261013110000_count_only_comparable_property_images.sql" ]]; then
            echo "::error::Expected only migration 20261013110000 to be pending; no migration was applied."
            exit 1
          fi

      - name: Apply the verified migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Verify remote migration history
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          history="$(supabase migration list --db-url "$SUPABASE_DB_URL")"
          printf '%s\n' "$history"
          if ! printf '%s\n' "$history" | grep -q '20261013110000'; then
            echo "::error::Migration 20261013110000 is missing from remote migration history."
            exit 1
          fi
