<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recupera tu acceso a Cubitat</title>
  </head>
  <body style="margin:0;background:#f4f7f6;color:#10231f;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7f6;padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dce6e2;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 10px;">
                <p style="margin:0 0 12px;color:#006b5d;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">Cubitat</p>
                <h1 style="margin:0;color:#10231f;font-size:28px;line-height:1.1;">Crea una nueva contrasena</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 28px 28px;color:#60716e;font-size:16px;line-height:1.55;">
                <p style="margin:0 0 18px;">Recibimos una solicitud para recuperar tu acceso. Usa este enlace para crear una nueva contrasena.</p>
                <p style="margin:0 0 26px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#006b5d;color:#ffffff;text-decoration:none;font-weight:700;border-radius:12px;padding:13px 20px;">Cambiar contrasena</a>
                </p>
                <p style="margin:0 0 10px;font-size:13px;color:#60716e;">Si no solicitaste este cambio, ignora este correo.</p>
                <p style="margin:0;word-break:break-all;font-size:12px;color:#006b5d;">{{ .ConfirmationURL }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
